data_dir = "/etc/vector/data"

[sources.suricata]
type = "file"
include = ["/logs/suricata/eve.json"]
read_from = "end"

[sources.zeek]
type = "file"
include = [
    "/logs/zeek/conn.log"
]
read_from = "end"

[transforms.suricata_json]
type = "remap"
inputs = ["suricata"]
source = '''
parsed, err = parse_json(.message)
if err == null {
  . = parsed
  .source = "suricata"
} else {
  abort
}
'''

[transforms.zeek_json]
type = "remap"
inputs = ["zeek"]
source = '''
parsed, err = parse_json(.message)
if err == null {
  . = parsed
  .source = "zeek"
} else {
  abort
}
'''

[sinks.kafka]
type = "kafka"
inputs = ["suricata_json", "zeek_json"]
bootstrap_servers = "kafka:9092"
topic = "ndr-events"
encoding.codec = "json"
# Low-latency batching — flush every 100ms max
batch.timeout_secs = 0.1
batch.max_events = 100

# Disk buffer: spools events when Kafka is temporarily unavailable
# so no logs are lost during brief Kafka restarts or network blips
[sinks.kafka.buffer]
type = "disk"
max_size = 536870912
when_full = "block"