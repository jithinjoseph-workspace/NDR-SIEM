events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # A single page load fires ~15-20 API calls at once (sensor-keys, stats,
    # severity, stats/timeline, aria/status, auth/me, auth/users, etc — all
    # share this one zone per client IP). At the old 120r/m (2r/s) refill,
    # two page loads/reloads within ~10-15s exhausted the burst and threw
    # real requests into 429s. Raised so normal reload behavior has headroom.
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=300r/m;
    limit_req_status 429;

    upstream clickhouse_pool {
        least_conn;
        server clickhouse1:8123 max_fails=2 fail_timeout=10s;
        server clickhouse2:8123 max_fails=2 fail_timeout=10s backup;
    }

    server {
        listen 8123;
        location / {
            proxy_pass         http://clickhouse_pool;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout    60s;
            proxy_next_upstream   error timeout http_502 http_503;
        }
    }

    upstream auth_service {
        server provigil-auth:3001 max_fails=3 fail_timeout=10s;
    }

    upstream ndr_engines {
        least_conn;
        server ndr-engine-1:3000 max_fails=3 fail_timeout=30s;
        server ndr-engine-2:3000 max_fails=3 fail_timeout=30s;
        server ndr-engine-3:3000 max_fails=3 fail_timeout=30s;
        # ENGINES_MARKER
    }

    upstream ws_engines {
        ip_hash;
        server ndr-engine-1:3000;
        server ndr-engine-2:3000;
        server ndr-engine-3:3000;
        # WS_ENGINES_MARKER
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server_tokens off;

    server {
        listen 443 ssl;
        client_max_body_size 100m;

        ssl_certificate     /etc/nginx/ssl/ndr.crt;
        ssl_certificate_key /etc/nginx/ssl/ndr.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https://www.google.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; form-action 'self';" always;

        location /ws {
            proxy_pass         http://ws_engines;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }

        location = /api/auth/login {
            limit_req zone=login_limit burst=2 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/logout {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/refresh {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/me {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/check-username {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/reset-password {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/mfa/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/users {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/tenants {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/me/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/forgot/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SIEM not available in NDR-only mode
        location /api/siem {
            return 503 '{"error":"SIEM module not installed"}';
            add_header Content-Type application/json always;
        }

        location /api/xdr {
            return 503 '{"error":"SIEM module not installed"}';
            add_header Content-Type application/json always;
        }

        location /api/announcements {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass         http://ndr_engines;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://ndr_engines;
        }

        location = /product-config.json {
            add_header Content-Type  application/json;
            add_header Cache-Control "no-cache";
            return 200 '{"product_mode":"ndr"}';
        }

        location /favicon-proxy {
            resolver 8.8.8.8 valid=30s;
            proxy_pass https://t0.gstatic.com/faviconV2$is_args$args;
            proxy_set_header Host t0.gstatic.com;
            proxy_ssl_server_name on;
            proxy_set_header Referer "";
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            set $ndr_ui http://ndr-ui:80;
            proxy_pass         $ndr_ui;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
