<section class="admin-panel">
  <div class="panel-head">
    <div>
      <h3>Sender Gmail Configuration</h3>
      <p>Configure the SMTP credentials used by the system to send emails (e.g., password reset OTPs).</p>
    </div>
  </div>

  <div class="threshold-list" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; background: var(--surface, #1e293b); border: 1px solid var(--border, #2a3550); border-radius: 8px;">
    <div class="form-group" style="display: flex; gap: 1rem;">
      <label style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
        <span style="font-size: 0.875rem; font-weight: 500; color: var(--text-2, #94a3b8);">SMTP Host</span>
        <input type="text" [(ngModel)]="smtpConfig.host"
          style="padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border, #2a3550); background: var(--surface-2, #111827); color: white; outline: none; transition: border-color 0.2s;"
          onfocus="this.style.borderColor='var(--primary, #3b82f6)'"
          onblur="this.style.borderColor='var(--border, #2a3550)'" />
      </label>
      <label style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
        <span style="font-size: 0.875rem; font-weight: 500; color: var(--text-2, #94a3b8);">SMTP Port</span>
        <input type="number" [(ngModel)]="smtpConfig.port"
          style="padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border, #2a3550); background: var(--surface-2, #111827); color: white; outline: none; transition: border-color 0.2s;"
          onfocus="this.style.borderColor='var(--primary, #3b82f6)'"
          onblur="this.style.borderColor='var(--border, #2a3550)'" />
      </label>
    </div>

    <div class="form-group" style="display: flex; gap: 1rem;">
      <label style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
        <span style="font-size: 0.875rem; font-weight: 500; color: var(--text-2, #94a3b8);">Gmail Address (Username)</span>
        <input type="email" [(ngModel)]="smtpConfig.user" placeholder="e.g. security@yourdomain.com"
          style="padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border, #2a3550); background: var(--surface-2, #111827); color: white; outline: none; transition: border-color 0.2s;"
          onfocus="this.style.borderColor='var(--primary, #3b82f6)'"
          onblur="this.style.borderColor='var(--border, #2a3550)'" />
      </label>
      <label style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
        <span style="font-size: 0.875rem; font-weight: 500; color: var(--text-2, #94a3b8);">App Password</span>
        <input type="password" [(ngModel)]="smtpConfig.password" placeholder="Leave empty to keep existing password"
          style="padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border, #2a3550); background: var(--surface-2, #111827); color: white; outline: none; transition: border-color 0.2s;"
          onfocus="this.style.borderColor='var(--primary, #3b82f6)'"
          onblur="this.style.borderColor='var(--border, #2a3550)'" />
      </label>
    </div>

    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1rem; margin-top: 1rem;">
      <div *ngIf="smtpMessage" class="feedback success"
        style="margin: 0; padding: 0.5rem; background: transparent; border: none; flex-direction: row; gap: 0.5rem;">
        <lucide-icon [name]="CheckIcon" class="w-4 h-4"></lucide-icon>
        <span>{{ smtpMessage }}</span>
      </div>
      <div *ngIf="smtpError" class="feedback error"
        style="margin: 0; padding: 0.5rem; background: transparent; border: none; flex-direction: row; gap: 0.5rem;">
        <lucide-icon [name]="ErrorIcon" class="w-4 h-4"></lucide-icon>
        <span>{{ smtpError }}</span>
      </div>
      <button class="primary-action" style="width: auto; padding: 0.6rem 1.5rem;"
        (click)="saveSmtpConfig()" [disabled]="savingSmtp">
        <lucide-icon [name]="savingSmtp ? LoadingIcon : SaveIcon" class="w-4 h-4" [class.spin]="savingSmtp"></lucide-icon>
        {{ savingSmtp ? 'Saving...' : 'Save Configuration' }}
      </button>
    </div>
  </div>
</section>
