<div class="p-8 animate-in fade-in duration-500">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h2 class="text-2xl font-display font-bold text-white uppercase tracking-tight">Threat Intel Management</h2>
      <p class="text-on-surface-variant text-sm mt-1">Cross-referenced IoCs from global feeds</p>
    </div>
    <div class="flex gap-2">
      <button class="bg-surface-container-low text-on-surface-variant hover:text-white p-2 rounded-md border border-outline/10 transition-all">
        <lucide-icon [name]="RefreshIcon" class="w-4 h-4"></lucide-icon>
      </button>
      <div class="relative">
        <lucide-icon [name]="SearchIcon" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant"></lucide-icon>
        <input type="text" placeholder="Lookup IoC..." class="bg-surface-container-highest border border-outline/10 rounded-md py-2 pl-10 pr-4 text-xs text-white focus:outline-none focus:border-primary/50 transition-all">
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div *ngFor="let stat of [{label: 'Total Indicators', val: '4,231', icon: HashIcon, color: 'text-primary'}, {label: 'High Confidence', val: '842', icon: ShieldCheckIcon, color: 'text-secondary'}, {label: 'Active Blocks', val: '124', icon: AlertIcon, color: 'text-tertiary'}]" 
         class="bg-surface-container-highest p-6 rounded-xl border border-outline/10">
      <div class="flex items-center gap-4">
        <div class="p-3 bg-white/5 rounded-lg">
          <lucide-icon [name]="stat.icon" [class]="'w-6 h-6 ' + stat.color"></lucide-icon>
        </div>
        <div>
          <p class="text-[10px] text-on-surface-variant uppercase font-bold tracking-widest">{{ stat.label }}</p>
          <p class="text-xl font-display font-bold text-white">{{ stat.val }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-surface-container-highest rounded-lg overflow-hidden border border-outline/5">
     <div class="px-6 py-4 border-b border-outline/10 flex items-center justify-between">
       <span class="text-xs font-bold text-white uppercase tracking-wider">Top Indicators</span>
       <button class="text-[10px] font-bold text-primary hover:underline">Download Feed (STIX/TAXII)</button>
     </div>
     <table class="w-full text-left border-collapse">
       <tbody class="divide-y divide-outline/5 font-mono text-[12px]">
         <tr *ngFor="let ioc of indicators" class="hover:bg-surface-container-low/50 transition-colors">
            <td class="px-6 py-4">
              <span class="text-white">{{ ioc.value }}</span>
            </td>
            <td class="px-6 py-4">
               <span class="text-[10px] bg-white/5 px-2 py-0.5 rounded text-on-surface-variant italic">{{ ioc.Capability }}</span>
            </td>
            <td class="px-6 py-4 text-on-surface-variant">
               {{ ioc.source }}
            </td>
            <td class="px-6 py-4">
               <div class="flex items-center gap-2">
                 <div class="h-1.5 w-16 bg-surface-container-low rounded-full">
                    <div [style.width.%]="ioc.confidence" class="h-full bg-secondary rounded-full"></div>
                 </div>
                 <span class="text-secondary text-[10px] font-bold">{{ ioc.confidence }}%</span>
               </div>
            </td>
            <td class="px-6 py-4 text-right text-on-surface-variant text-[11px]">
               {{ ioc.lastSeen }}
            </td>
         </tr>
       </tbody>
     </table>
  </div>
</div>
