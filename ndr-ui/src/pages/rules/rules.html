<div class="p-8 animate-in fade-in duration-500">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h2 class="text-2xl font-display font-bold text-white uppercase tracking-tight">Rules Management</h2>
      <p class="text-on-surface-variant text-sm mt-1">Detection logic, Sigma rules, and YARA signatures</p>
    </div>
    <button class="bg-primary text-black text-xs font-bold px-4 py-2 rounded-md flex items-center gap-2 hover:bg-primary/90 transition-transform active:scale-95">
      <lucide-icon [name]="PlusIcon" class="w-4 h-4"></lucide-icon>
      Create New Rule
    </button>
  </div>

  <div class="grid grid-cols-1 gap-4">
    <div *ngFor="let rule of rules" class="bg-surface-container-highest p-5 rounded-lg border border-outline/10 flex items-center justify-between group hover:border-primary/30 transition-all">
      <div class="flex items-center gap-5">
        <div class="p-3 rounded bg-surface-container-low text-on-surface-variant group-hover:text-primary transition-colors">
          <lucide-icon [name]="GavelIcon" class="w-6 h-6"></lucide-icon>
        </div>
        <div>
          <h3 class="text-white font-bold">{{ rule.name }}</h3>
          <div class="flex items-center gap-3 mt-1">
            <span class="text-[10px] text-on-surface-variant bg-surface-container-low px-2 py-0.5 rounded uppercase font-bold border border-outline/5">{{ rule.type }}</span>
            <span [class]="'text-[10px] font-bold uppercase ' + (rule.severity === 'CRITICAL' ? 'text-tertiary' : rule.severity === 'HIGH' ? 'text-secondary' : 'text-primary')">
              {{ rule.severity }} PRIORITY
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-8">
        <div class="flex flex-col items-end">
          <span class="text-[10px] text-on-surface-variant uppercase tracking-wider font-bold">Last Triggered</span>
          <span class="text-xs text-white">{{ rule.lastTriggered }}</span>
        </div>
        <div class="flex items-center gap-2">
          <button [class]="'p-2 rounded hover:bg-surface-container-low transition-colors ' + (rule.status === 'ACTIVE' ? 'text-primary' : 'text-on-surface-variant')">
            <lucide-icon [name]="PowerIcon" class="w-4 h-4"></lucide-icon>
          </button>
          <button class="p-2 rounded hover:bg-surface-container-low text-on-surface-variant hover:text-white transition-colors">
            <lucide-icon [name]="EditIcon" class="w-4 h-4"></lucide-icon>
          </button>
          <button class="p-2 rounded hover:bg-surface-container-low text-on-surface-variant hover:text-tertiary transition-colors">
            <lucide-icon [name]="TrashIcon" class="w-4 h-4"></lucide-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
