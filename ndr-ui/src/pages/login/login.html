<div class="login-root">

  <!-- Animated background grid -->
  <div class="login-bg-grid"></div>

  <!-- Floating orbs for depth -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-wrapper">

    <!-- Brand -->
    <div class="login-brand">
      <div class="login-logo">
        <!-- Shield SVG icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="login-title">NDR COMMAND</h1>
      <p class="login-subtitle">TACTICAL OBSERVATORY</p>
    </div>

    <!-- Card -->
    <div class="login-card">
      <h2 class="login-card-heading">Sign in to your account</h2>

      <!-- Error banner -->
      <div *ngIf="error" class="login-error" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error }}</span>
      </div>

      <!-- Username field -->
      <div class="login-field">
        <label class="login-label" for="login-username">Username</label>
        <div class="login-input-wrap">
          <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            id="login-username"
            [(ngModel)]="username"
            (ngModelChange)="onUsernameChange()"
            (keyup.enter)="login()"
            placeholder="Enter username"
            autocomplete="username"
            class="login-input"
            [class.login-input--has-status]="usernameStatus !== 'idle'"
            [class.input-found]="usernameStatus === 'found'"
            [class.input-not-found]="usernameStatus === 'not_found'" />

          <!-- Inline right-side status icon inside the input -->
          <span *ngIf="usernameStatus === 'checking'" class="input-status-icon input-status-icon--checking">
            <svg class="login-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
          </span>
          <span *ngIf="usernameStatus === 'found'" class="input-status-icon input-status-icon--found">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <span *ngIf="usernameStatus === 'not_found'" class="input-status-icon input-status-icon--not-found">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </span>
        </div>


        <!-- Live username status indicator -->
        <div *ngIf="usernameStatus === 'checking'" class="username-status username-status--checking">
          <svg class="login-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
          <span>Checking...</span>
        </div>
        <div *ngIf="usernameStatus === 'found'" class="username-status username-status--found">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Username recognised</span>
        </div>
        <div *ngIf="usernameStatus === 'not_found'" class="username-status username-status--not-found">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          <span>Username not found</span>
        </div>
      </div>


      <!-- Password field -->
      <div class="login-field">
        <label class="login-label" for="login-password">Password</label>
        <div class="login-input-wrap">
          <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            id="login-password"
            [(ngModel)]="password"
            (keyup.enter)="login()"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter password"
            autocomplete="current-password"
            class="login-input login-input--password" />
          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="toggle-pw"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <!-- Eye open -->
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye closed -->
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        type="button"
        id="login-submit"
        (click)="login()"
        [disabled]="loading"
        class="login-btn"
        [class.login-btn--loading]="loading">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="login-spinner-wrap">
          <svg class="login-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
          Signing in...
        </span>
      </button>

      <!-- Default credentials hint -->
      <div class="login-hint">
        <span class="hint-label">Default credentials</span>
        <span class="hint-cred">admin</span>
        <span class="hint-sep">/</span>
        <span class="hint-cred">ndr&#64;admin123</span>
      </div>
    </div>

    <!-- Footer -->
    <p class="login-footer">
      NDR Stack v1.0 &mdash; Powered by Agent-Z &amp; Agent-S
    </p>
  </div>
</div>
