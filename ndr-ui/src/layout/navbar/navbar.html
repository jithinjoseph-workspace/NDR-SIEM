<header class="topbar">
  <div class="search-wrap">
    <lucide-icon [name]="SearchIcon" class="search-icon w-4 h-4"></lucide-icon>
    <input
      type="text"
      [(ngModel)]="searchText"
      (input)="onSearchInput()"
      (keydown)="onSearch($event)"
      (blur)="closeSearch()"
      placeholder="Search IPs, alerts, rules, and logs"
    />

    <div *ngIf="showSuggestions" class="suggestions-panel">
      <button *ngFor="let s of filteredSuggestions" (mousedown)="selectSuggestion(s)" class="suggestion-row">
        <span class="suggestion-icon">{{ s.label.charAt(0) }}</span>
        <span>
          <strong>{{ s.label }}</strong>
          <small>{{ s.hint }}</small>
        </span>
      </button>

      <div class="quick-links">
        <span>Quick Navigate</span>
        <div>
          <button *ngFor="let s of suggestions.slice(0, 4)" (mousedown)="selectSuggestion(s)">
            {{ s.label }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="topbar-actions">
    <div class="system-card">
      <span>System Status</span>
      <strong [class.degraded]="systemStatus !== 'OPERATIONAL'">
        <i></i>
        {{ systemStatus }}
      </strong>
    </div>

    <button class="icon-button" aria-label="Notifications">
      <lucide-icon [name]="BellIcon" class="w-5 h-5"></lucide-icon>
      <span>{{ alertCount }}</span>
    </button>

    <button class="profile-button">
      <span class="avatar">
        <lucide-icon [name]="UserIcon" class="w-5 h-5"></lucide-icon>
      </span>
      <span class="profile-copy">
        <strong>Analyst 01</strong>
        <small>Admin Level</small>
      </span>
      <lucide-icon [name]="ChevronDownIcon" class="w-3 h-3 chevron-icon"></lucide-icon>
    </button>
  </div>
</header>
