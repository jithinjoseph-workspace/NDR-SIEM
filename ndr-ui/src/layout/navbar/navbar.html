<header class="topbar">
  <div class="search-wrap">
    <lucide-icon [name]="SearchIcon" class="search-icon w-4 h-4"></lucide-icon>
    <input
      type="text"
      [(ngModel)]="searchText"
      (input)="onSearchInput()"
      (keydown)="onSearch($event)"
      (blur)="closeSearch()"
      placeholder="Search IPs, alerts, rules, and logs"
    />

    <div *ngIf="showSuggestions" class="suggestions-panel">
      <button *ngFor="let s of filteredSuggestions" (mousedown)="selectSuggestion(s)" class="suggestion-row">
        <span class="suggestion-icon">{{ s.label.charAt(0) }}</span>
        <span>
          <strong>{{ s.label }}</strong>
          <small>{{ s.hint }}</small>
        </span>
      </button>

      <div class="quick-links">
        <span>Quick Navigate</span>
        <div>
          <button *ngFor="let s of suggestions.slice(0, 4)" (mousedown)="selectSuggestion(s)">
            {{ s.label }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="topbar-actions">
    <div class="system-card">
      <span>System Status</span>
      <strong [class.degraded]="systemStatus !== 'OPERATIONAL'">
        <i></i>
        {{ systemStatus }}
      </strong>
    </div>

    <div class="notification-wrap" (focusout)="closeNotifications()">
      <button class="icon-button" aria-label="Notifications" (click)="openNotifications()">
        <lucide-icon [name]="BellIcon" class="w-5 h-5"></lucide-icon>
        <span *ngIf="alertCount > 0">{{ alertCount > 9 ? '9+' : alertCount }}</span>
      </button>

      <div *ngIf="showNotifications" class="notification-panel">
        <div class="notification-head">
          <strong>Threat Alerts</strong>
          <small>{{ recentAlerts.length }} recent</small>
        </div>

        <div *ngIf="recentAlerts.length === 0" class="notification-empty">
          No threat alerts yet
        </div>

        <div *ngIf="recentAlerts.length > 0" class="notification-list">
          <div *ngFor="let alert of recentAlerts" class="notification-row">
            <div>
              <strong>{{ alert.message }}</strong>
              <span>{{ alert.src_ip }} -> {{ alert.dst_ip }}</span>
              <em>{{ alert.hits }} {{ alert.hits === 1 ? 'hit' : 'hits' }} · Latest {{ alert.time }}</em>
            </div>
            <small>
              <span>Score</span>
              <b>{{ alert.score?.toFixed(0) }}</b>
            </small>
          </div>
        </div>

        <button class="notification-link" (mousedown)="viewThreatIntel()">
          View Threat Intel
        </button>
      </div>
    </div>

    <button class="profile-button" (click)="showUserMenu=!showUserMenu"
      style="position:relative">
      <span class="avatar">
        <lucide-icon [name]="UserIcon" class="w-5 h-5"></lucide-icon>
      </span>
      <span class="profile-copy">
        <strong>{{ currentUser?.username || 'User' }}</strong>
        <small>{{ currentUser?.role || 'analyst' }}</small>
      </span>
      <lucide-icon [name]="ChevronDownIcon" class="w-3 h-3 chevron-icon"></lucide-icon>
      <!-- Dropdown -->
      <div *ngIf="showUserMenu"
        style="position:absolute;top:100%;right:0;
        background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);
        border-radius:8px;padding:8px;min-width:150px;z-index:1000">
        <button (click)="logout()"
          style="width:100%;text-align:left;padding:8px 12px;
          color:#ff4444;font-size:12px;border-radius:4px;
          background:none;border:none;cursor:pointer">
          🚪 Logout
        </button>
      </div>
    </button>
  </div>
</header>
