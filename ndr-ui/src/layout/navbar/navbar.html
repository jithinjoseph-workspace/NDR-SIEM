<header class="h-16 bg-surface border-b border-outline/5 flex items-center justify-between px-8">
  <div class="flex items-center gap-4 flex-1">
    <div class="relative w-full max-w-md group">
      <lucide-icon [name]="SearchIcon" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"></lucide-icon>
      <input type="text" 
             placeholder="Search metrics, logs, or rules..." 
             class="w-full bg-surface-container-low border-none rounded-full py-2 pl-10 pr-4 text-sm text-white placeholder:text-on-surface-variant focus:ring-1 focus:ring-primary/30 outline-none transition-all">
    </div>
  </div>

  <div class="flex items-center gap-6">
    <div class="flex flex-col items-end">
      <span class="text-[10px] text-on-surface-variant uppercase tracking-wider">System Status</span>
      <div class="flex items-center gap-1.5">
        <div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse shadow-[0_0_8px_rgba(105,246,184,0.5)]"></div>
        <span class="text-[11px] font-bold text-primary">{{ systemStatus }}</span>
      </div>
    </div>

    <div class="h-8 w-px bg-outline/10"></div>

    <button class="relative text-on-surface-variant hover:text-white transition-colors">
      <lucide-icon [name]="BellIcon" class="w-5 h-5"></lucide-icon>
      <span class="absolute -top-1 -right-1 w-4 h-4 bg-tertiary text-[10px] font-bold text-white flex items-center justify-center rounded-full">4</span>
    </button>

    <button class="flex items-center gap-3 pl-4 border-l border-outline/10 group">
      <div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline/20 flex items-center justify-center text-primary overflow-hidden">
         <lucide-icon [name]="UserIcon" class="w-5 h-5"></lucide-icon>
      </div>
      <div class="flex flex-col items-start leading-none">
        <span class="text-xs font-semibold text-white">Analyst 01</span>
        <span class="text-[10px] text-on-surface-variant">Admin Level</span>
      </div>
      <lucide-icon [name]="ChevronDownIcon" class="w-3 h-3 text-on-surface-variant group-hover:text-white transition-colors"></lucide-icon>
    </button>
  </div>
</header>
