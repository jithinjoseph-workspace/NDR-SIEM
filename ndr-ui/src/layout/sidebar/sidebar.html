<aside class="sidebar-shell">

  <!-- Brand -->
  <div class="brand-block">
    <div class="brand-wordmark">
      <span class="brand-name">PromaAlpha</span>
      <span class="brand-tagline">NDR Platform</span>
    </div>
    <div class="brand-badge">
      <span class="brand-badge-text">powered by</span>
      <img src="/assets/images/promasecure.png" alt="PromaSecure" class="brand-badge-logo" />
    </div>
  </div>

  <!-- Nav -->
  <nav class="nav-list">
    <ng-container *ngFor="let item of navItems">
      <div *ngIf="item.section" class="nav-section">
        <span>{{ item.section }}</span>
      </div>
      <a [routerLink]="item.route" [queryParams]="item.queryParams || null"
         [class.active]="isActive(item)" class="nav-link">
        <span class="nav-icon">
          <lucide-icon [name]="item.icon" class="w-4 h-4"></lucide-icon>
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </ng-container>
  </nav>

</aside>
