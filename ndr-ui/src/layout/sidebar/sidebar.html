<aside class="w-64 bg-surface-container-low h-full flex flex-col border-r border-outline/10">
  <div class="p-6">
    <h1 class="text-primary font-display text-xl font-bold tracking-tight">NDR COMMAND</h1>
    <p class="text-on-surface-variant text-[10px] uppercase tracking-[0.2em] mt-1">Tactical Observatory</p>
  </div>

  <nav class="flex-1 px-4 space-y-1 mt-4">
    <a *ngFor="let item of navItems" 
       [routerLink]="item.route" 
       routerLinkActive="bg-surface-container-highest text-primary"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container-highest hover:text-white transition-all duration-200 group">
      <lucide-icon [name]="item.icon" class="w-5 h-5 group-hover:scale-110 transition-transform"></lucide-icon>
      <span class="text-sm font-medium">{{ item.label }}</span>
    </a>
  </nav>

  <div class="p-4 border-t border-outline/5 space-y-1">
    <a *ngFor="let item of bottomItems" 
       [routerLink]="item.route"
       class="flex items-center gap-3 px-3 py-2 rounded-md text-on-surface-variant hover:bg-surface-container-highest hover:text-white transition-all">
      <lucide-icon [name]="item.icon" class="w-4 h-4"></lucide-icon>
      <span class="text-xs font-medium">{{ item.label }}</span>
    </a>
  </div>
</aside>
