<aside class="sidebar-shell">

  <!-- Brand -->
  <div class="brand-block">
    <div class="brand-wordmark" style="display: flex; justify-content: center; width: 100%; margin-bottom: 16px; margin-top: 4px; position: relative; z-index: 2;">
      <img src="/assets/images/ProVigilAI_logo.png" alt="ProVigil Logo" style="height: 115px; max-width: 100%; object-fit: contain; background: transparent; filter: drop-shadow(0 4px 12px rgba(34, 197, 94, 0.45)); transform: scale(1); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), filter 0.3s ease;" onmouseover="this.style.transform='scale(1.08)'; this.style.filter='drop-shadow(0 6px 16px rgba(34, 197, 94, 0.65))'" onmouseout="this.style.transform='scale(1)'; this.style.filter='drop-shadow(0 4px 12px rgba(34, 197, 94, 0.45))'" />
    </div>
    <div class="brand-badge">
      <span class="brand-badge-text">powered by</span>
      <img src="/assets/images/promasecure.png" alt="PromaSecure" class="brand-badge-logo" />
    </div>
  </div>

  <!-- Nav -->
  <nav class="nav-list">
    <ng-container *ngFor="let group of navGroups; trackBy: trackGroup">

      <!-- Collapsible section header -->
      <button class="nav-section"
              [class.is-collapsed]="group.collapsed"
              (click)="toggleGroup(group)">
        <span>{{ group.section }}</span>
        <lucide-icon [name]="ChevronDownIcon" class="nav-chevron w-3 h-3"></lucide-icon>
      </button>

      <!-- Items — shown/hidden via ngIf so initial render is always correct -->
      <div class="nav-group-body" *ngIf="!group.collapsed">
        <a *ngFor="let item of group.items; let i = index; trackBy: trackItem"
           [routerLink]="item.route"
           [queryParams]="item.queryParams || null"
           [class.active]="isActive(item)"
           class="nav-link"
           [style.animation-delay]="(i * 40) + 'ms'">
          <span class="nav-icon">
            <lucide-icon [name]="item.icon" class="w-4 h-4"></lucide-icon>
          </span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </div>

    </ng-container>
  </nav>

</aside>
