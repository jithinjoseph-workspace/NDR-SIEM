<aside class="sidebar-shell">
  <div class="brand-block" style="flex-direction: column; align-items: flex-start; padding: 18px 20px;">
    <h1 style="margin: 0; color: var(--color-on-surface-variant, #f7f9ff); font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.02em; text-transform: none;">PromaAlpha</h1>
    <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px; background-color: white; padding: 4px 10px; border-radius: 20px; width: fit-content; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
      <span style="font-size: 10px; color: #000; background-color: white; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;">powered by</span>
      <img src="/assets/images/promasecure.png" alt="PromaSecure" style="height: 18px; object-fit: contain;" />
    </div>
  </div>

  <nav class="nav-list">
    <a *ngFor="let item of navItems" [routerLink]="item.route" [queryParams]="item.queryParams || null"
      [class.active]="isActive(item)" class="nav-link">
      <lucide-icon [name]="item.icon" class="w-5 h-5"></lucide-icon>
      <span>{{ item.label }}</span>
    </a>
  </nav>

</aside>
