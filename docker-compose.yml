services:

  # ── Kafka 3-broker KRaft cluster ─────────────────────────────────────────
  # Cluster ID generated once: docker run --rm apache/kafka:4.2.0
  #   /opt/kafka/bin/kafka-storage.sh random-uuid
  # Must be identical across all 3 brokers.

  kafka1:
    image: apache/kafka:4.2.0
    container_name: kafka1
    mem_limit: 1g
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "2RGQj2hlSfOoltzP3aUfng"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "536870912"
      KAFKA_LOG_SEGMENT_BYTES: "536870912"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  kafka2:
    image: apache/kafka:4.2.0
    container_name: kafka2
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "2RGQj2hlSfOoltzP3aUfng"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "536870912"
      KAFKA_LOG_SEGMENT_BYTES: "536870912"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  kafka3:
    image: apache/kafka:4.2.0
    container_name: kafka3
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "2RGQj2hlSfOoltzP3aUfng"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "536870912"
      KAFKA_LOG_SEGMENT_BYTES: "536870912"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── One-shot Kafka topic initialiser — creates ndr-events before engines start ──
  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    entrypoint: ["bash", "-c",
      "/opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 \
        --create \
        --if-not-exists \
        --topic ndr-events \
        --partitions 4 \
        --replication-factor 3 \
      && echo '[NDR] Kafka topic ndr-events ready'"]
    restart: "no"

  vector:
    image: timberio/vector:0.32.1-alpine
    container_name: ndr-vector
    profiles: ["onpremise"]
    environment:
      - LOCAL_SENSOR_ID=${LOCAL_SENSOR_ID:-local-central}
      - TENANT_ID=${TENANT_ID:-default}
    volumes:
      - ${HOME_DIR}/.vector/vector.toml:/etc/vector/vector.toml:ro
      - ${HOME_DIR}/.vector/data:/etc/vector/data
      - ${HOME_DIR}/logs:/logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped


  ndr-engine-1:
    build: ./rust
    container_name: ndr-engine-1
    mem_limit: 1536m
    stop_grace_period: 5s
    privileged: true
    networks:
      - default
      - ndr-internal
    environment:
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - NDR_AGENT_URL=http://host.docker.internal:3001
      - NDR_AGENT_SECRET=${NDR_AGENT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse1:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-ndr123}
      - INSTANCE_ID=1
      - REDIS_URL=redis://ndr-redis:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HOST_IP=${HOST_IP}
      - SENSOR_MODE=${SENSOR_MODE:-agent}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ndr-redis:
        condition: service_started
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy

  ndr-engine-2:
    build: ./rust
    container_name: ndr-engine-2
    mem_limit: 1536m
    stop_grace_period: 5s
    privileged: true
    networks:
      - default
      - ndr-internal
    environment:
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - NDR_AGENT_URL=http://host.docker.internal:3001
      - NDR_AGENT_SECRET=${NDR_AGENT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse1:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-ndr123}
      - INSTANCE_ID=2
      - REDIS_URL=redis://ndr-redis:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HOST_IP=${HOST_IP}
      - SENSOR_MODE=${SENSOR_MODE:-agent}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ndr-redis:
        condition: service_started
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy

  ndr-engine-3:
    build: ./rust
    container_name: ndr-engine-3
    mem_limit: 1536m
    stop_grace_period: 5s
    privileged: true
    networks:
      - default
      - ndr-internal
    environment:
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - NDR_AGENT_URL=http://host.docker.internal:3001
      - NDR_AGENT_SECRET=${NDR_AGENT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse1:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-ndr123}
      - INSTANCE_ID=3
      - REDIS_URL=redis://ndr-redis:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HOST_IP=${HOST_IP}
      - SENSOR_MODE=${SENSOR_MODE:-agent}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ndr-redis:
        condition: service_started
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy

  ndr-redis:
    image: redis:7
    container_name: ndr-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # Nginx Load Balancer — HTTPS entry point (port 3000→443) with HTTP redirect (port 3001→80)
  nginx:
    image: nginx:alpine
    container_name: ndr-nginx
    ports:
      - "443:443"    # HTTPS — standard port
      - "3000:443"   # HTTPS — legacy port (keep for existing bookmarks)
      - "80:80"      # HTTP — issues 301 redirect to https
      - "3080:80"    # HTTP — legacy port
    volumes:
      - ${INSTALL_DIR}/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${INSTALL_DIR}/config/nginx/ssl:/etc/nginx/ssl:ro   # TLS cert & key
      - ${INSTALL_DIR}/ndr-ui/dist/ndr-ui/browser:/usr/share/nginx/html:ro
    depends_on:
      ndr-engine-1:
        condition: service_healthy
      ndr-engine-2:
        condition: service_healthy
      ndr-engine-3:
        condition: service_healthy
    networks:
      - ndr-internal
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.5.0
    container_name: ndr-opensearch
    mem_limit: 2g
    cpus: "2.0"
    profiles: ["onpremise"]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:24.8
    container_name: clickhouse-keeper
    networks:
      - ndr-internal
    volumes:
      - keeper-data:/var/lib/clickhouse
      - keeper-logs:/var/log/clickhouse-keeper
      - ${INSTALL_DIR}/config/clickhouse/cluster/keeper-config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    entrypoint: [""]
    command: ["/bin/sh", "-c", "chown -R 0:0 /var/lib/clickhouse /var/log/clickhouse-keeper && exec clickhouse-keeper --config-file=/etc/clickhouse-keeper/keeper_config.xml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181 && echo ruok >&3 && timeout 2 cat <&3 | grep -q imok' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  clickhouse1:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse1
    networks:
      - ndr-internal
    ports:
      - "127.0.0.1:8123:8123"   # localhost-only — host agent (ndr-agent.py) access
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse1-data:/var/lib/clickhouse
      - clickhouse1-logs:/var/log/clickhouse-server
      - ${INSTALL_DIR}/config/clickhouse/cluster/ch1-config.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ${INSTALL_DIR}/config/clickhouse/cluster/z-ndr-listen.xml:/etc/clickhouse-server/config.d/z-ndr-listen.xml:ro
      - ${INSTALL_DIR}/config/clickhouse/cluster/users.xml:/etc/clickhouse-server/users.d/ndr-users.xml:ro
    entrypoint: [""]
    command: ["/bin/sh", "-c", "chown -R 0:0 /var/lib/clickhouse /var/log/clickhouse-server && exec clickhouse-server --config-file=/etc/clickhouse-server/config.xml"]
    restart: unless-stopped
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse2:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse2
    networks:
      - ndr-internal
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse2-data:/var/lib/clickhouse
      - clickhouse2-logs:/var/log/clickhouse-server
      - ${INSTALL_DIR}/config/clickhouse/cluster/ch2-config.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ${INSTALL_DIR}/config/clickhouse/cluster/z-ndr-listen.xml:/etc/clickhouse-server/config.d/z-ndr-listen.xml:ro
      - ${INSTALL_DIR}/config/clickhouse/cluster/users.xml:/etc/clickhouse-server/users.d/ndr-users.xml:ro
    entrypoint: [""]
    command: ["/bin/sh", "-c", "chown -R 0:0 /var/lib/clickhouse /var/log/clickhouse-server && exec clickhouse-server --config-file=/etc/clickhouse-server/config.xml"]
    restart: unless-stopped
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ── One-shot schema initialiser — runs after both nodes are healthy ──────────
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-init
    networks:
      - ndr-internal
    volumes:
      - ${INSTALL_DIR}/config/clickhouse/init.sql:/init.sql:ro
    depends_on:
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy
    entrypoint: ["bash", "-c", "clickhouse-client --host clickhouse1 --port 9000 --user ndr --password ${CLICKHOUSE_PASSWORD:-ndr123} --multiquery < /init.sql && echo '[NDR] ClickHouse schema ready'"]
    restart: on-failure

volumes:
  opensearch-data:
  redis:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  clickhouse1-data:
  clickhouse1-logs:
  clickhouse2-data:
  clickhouse2-logs:
  keeper-data:
  keeper-logs:

networks:
  ndr-internal:
    driver: bridge
