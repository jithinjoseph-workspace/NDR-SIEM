services:

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  vector:
    image: timberio/vector:0.32.1-alpine
    container_name: vector
    volumes:
      - ${HOME_DIR}/.vector/vector.toml:/etc/vector/vector.toml:ro
      - ${HOME_DIR}/.vector/data:/etc/vector/data
      - ${HOME_DIR}/logs:/logs
    depends_on:
      kafka:
        condition: service_healthy

  ndr-engine-1:
    build: ./rust
    container_name: ndr-engine-1
    stop_grace_period: 5s
    privileged: true
    environment:
      - KAFKA_BROKERS=kafka:9092
      - NDR_AGENT_URL=http://${HOST_IP}:3001
      - CLICKHOUSE_URL=http://${HOST_IP}:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=ndr123
      - INSTANCE_ID=1
      - SHUFFLE_WEBHOOK_URL=${SHUFFLE_WEBHOOK_URL}
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - SHUFFLE_INTERNAL_URL=http://shuffle-backend:5001

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules

    depends_on:
      kafka:
        condition: service_healthy

  # Nginx Load Balancer — single entry point on port 3000
  nginx:
    image: nginx:alpine
    container_name: ndr-nginx
    ports:
      - "3000:80"
    volumes:
      - ${INSTALL_DIR}/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ndr-engine-1
    restart: unless-stopped

  # shuffle setting for soar-integration

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    hostname: shuffle-backend
    ports:
      - "5001:5001"
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - SHUFFLE_OPENSEARCH_URL=http://shuffle-opensearch:9200
      - SHUFFLE_DEFAULT_USERNAME=admin
      - SHUFFLE_DEFAULT_PASSWORD=shufflepassword
      - SHUFFLE_DEFAULT_APIKEY=${SHUFFLE_API_KEY}
      - ORG_ID=default
      - SHUFFLE_BASE_URL=http://shuffle-backend:5001
      - SHUFFLE_CLOUD_SYNC=false
      - SHUFFLE_PASS_WORKER_PROXY=false
      - ENVIRONMENT_NAME=default
      - SHUFFLE_WORKER_VERSION=latest
      - SHUFFLE_SKIPSSL_VERIFY=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shuffle-apps:/shuffle-apps
      - shuffle-files:/shuffle-files
    depends_on:
      - shuffle-opensearch

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    ports:
      - "3002:80"
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    depends_on:
      - shuffle-backend

  shuffle-opensearch:
    image: opensearchproject/opensearch:2.5.0
    container_name: shuffle-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - shuffle-opensearch:/usr/share/opensearch/data

  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    environment:
      - ENVIRONMENT_NAME=Shuffle
      - BASE_URL=http://shuffle-backend:5001
      - DOCKER_API_VERSION=1.40
      - SHUFFLE_BASE_URL=http://shuffle-backend:5001
      - SHUFFLE_PASS_WORKER_PROXY=false
      - CLEANUP=false
      - ORG_ID=default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - shuffle-backend

volumes:
  shuffle-apps:
  shuffle-files:
  shuffle-opensearch:

