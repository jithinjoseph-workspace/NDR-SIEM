services:

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  vector:
    image: timberio/vector:0.32.1-alpine
    container_name: vector
    volumes:
      - ${HOME_DIR}/.vector/vector.toml:/etc/vector/vector.toml:ro
      - ${HOME_DIR}/.vector/data:/etc/vector/data
      - ${HOME_DIR}/logs:/logs
    depends_on:
      kafka:
        condition: service_healthy

  ndr-engine:
    build: ./rust
    container_name: ndr-engine
    stop_grace_period: 5s
    ports:
      - "3000:3000"
    privileged: true
    environment:
      - KAFKA_BROKERS=kafka:9092
      - NDR_AGENT_URL=http://${HOST_IP}:3001
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=ndr123
    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
    depends_on:
      kafka:
        condition: service_healthy
  