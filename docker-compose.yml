services:

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "536870912"
      KAFKA_LOG_SEGMENT_BYTES: "536870912"
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  vector:
    image: timberio/vector:0.32.1-alpine
    container_name: ndr-vector
    profiles: ["onpremise"]
    volumes:
      - ${HOME_DIR}/.vector/vector.toml:/etc/vector/vector.toml:ro
      - ${HOME_DIR}/.vector/data:/etc/vector/data
      - ${HOME_DIR}/logs:/logs
    depends_on:
      - kafka
    restart: unless-stopped
        

  ndr-engine-1:
    build: ./rust
    container_name: ndr-engine-1
    stop_grace_period: 5s
    privileged: true
    environment:
      - KAFKA_BROKERS=kafka:9092
      - NDR_AGENT_URL=http://${HOST_IP}:3001
      - CLICKHOUSE_URL=http://${HOST_IP}:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=ndr123
      - INSTANCE_ID=1
      - REDIS_URL=redis://ndr-redis:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://${HOST_IP}:9200

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
    depends_on:
      - kafka
      - redis

  ndr-engine-2:
    build: ./rust
    container_name: ndr-engine-2
    stop_grace_period: 5s
    privileged: true
    environment:
      - KAFKA_BROKERS=kafka:9092
      - NDR_AGENT_URL=http://${HOST_IP}:3001
      - CLICKHOUSE_URL=http://${HOST_IP}:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=ndr123
      - INSTANCE_ID=2
      - REDIS_URL=redis://ndr-redis:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://${HOST_IP}:9200

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
    depends_on:
      - kafka
      - redis

  ndr-engine-3:
    build: ./rust
    container_name: ndr-engine-3
    stop_grace_period: 5s
    privileged: true
    environment:
      - KAFKA_BROKERS=kafka:9092
      - NDR_AGENT_URL=http://${HOST_IP}:3001
      - CLICKHOUSE_URL=http://${HOST_IP}:8123
      - CLICKHOUSE_USER=ndr
      - CLICKHOUSE_PASSWORD=ndr123
      - INSTANCE_ID=3
      - REDIS_URL=redis://ndr-redis:6379
      - INSTALL_DIR=${INSTALL_DIR}
      - RULES_DIR=/app/ndr-engine/rules
      - HOST_INSTALL_DIR=${INSTALL_DIR}
      - JWT_SECRET=${JWT_SECRET}
      - ARKIME_URL=${ARKIME_URL}
      - ARKIME_PASS=${ARKIME_PASS}
      - OPENSEARCH_URL=http://${HOST_IP}:9200

    volumes:
      - ${INSTALL_DIR}/scripts:/scripts
      - ${HOME_DIR}/logs:/logs
      - ${HOME_DIR}/ndr-config:/config
      - ${INSTALL_DIR}/rust/ndr-engine/rules:/app/ndr-engine/rules
      - ${INSTALL_DIR}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ndr/pcap:/opt/ndr/pcap
      - /opt/ndr/evidence:/opt/ndr/evidence
    depends_on:
      - kafka
      - redis

  redis:
    image: redis:7-alpine
    container_name: ndr-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # Nginx Load Balancer — single entry point on port 3000
  nginx:
    image: nginx:alpine
    container_name: ndr-nginx
    ports:
      - "3000:80"
    volumes:
      - ${INSTALL_DIR}/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ndr-engine-1
      - ndr-engine-2
      - ndr-engine-3
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.5.0
    container_name: ndr-opensearch
    profiles: ["onpremise"]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
      - "bootstrap.memory_lock=false"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data


volumes:
  opensearch-data:
  redis:
