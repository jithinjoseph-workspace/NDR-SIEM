[package]
name = "provigil-common"
version = "0.1.0"
edition = "2021"
description = "Shared types, JWT, SOAR, and threat-intel utilities for Provigil AI XDR services"

[dependencies]
jsonwebtoken = "9"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
chrono       = { version = "0.4", features = ["serde"] }
uuid         = { version = "1",   features = ["v4"] }
thiserror    = "1"
